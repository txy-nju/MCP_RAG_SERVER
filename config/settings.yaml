llm:
  provider: azure
  model: gpt-4o-mini

embedding:
  provider: openai
  model: text-embedding-3-small

splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 200

vector_store:
  provider: chroma
  collection: default
  persist_path: data/db/chroma

retrieval:
  top_k: 5

rerank:
  provider: none

evaluation:
  backend: custom

observability:
  log_level: INFO
  trace_file: logs/traces.jsonl
